[workspace]
members = [
    "taprux-core"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
serde = "1.0"
thiserror = "2.0"

# crux family
crux_core = "0.19"
facet = "=0.44"
boltffi = "0.25"

[workspace.lints.rust]
rust_2018_idioms = "deny"
# missing_docs = "deny"
missing_debug_implementations = "allow"
future_incompatible = "deny"
unsafe-code = "deny"

[workspace.lints.clippy]
unused_async = "deny"
pedantic = "warn"
